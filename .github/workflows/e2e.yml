name: E2E

# Real Obsidian + real Todoist. Runs only on the self-hosted runner that has
# Obsidian, xvfb and the throwaway Todoist account's secrets (see e2e/README.md).
#   pull_request (same repo only) → smoke subset (@smoke)
#   release tag push (same pattern as release.yml) → full matrix
#   manual dispatch → choose smoke or full
on:
  pull_request:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

# One Todoist account is shared by every run, and each run sweeps leftover
# "e2e*" resources at start — two runs at once would delete each other's data.
concurrency:
  group: e2e-todoist-account
  cancel-in-progress: false

jobs:
  e2e:
    # Never run fork PRs on the self-hosted runner: they could read the Todoist
    # secret and execute arbitrary code on the machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, obsidian-e2e]
    timeout-minutes: 150
    env:
      TODOIST_E2E_TOKEN: ${{ secrets.TODOIST_E2E_TOKEN }}
      TODOIST_E2E_EXPECTED_EMAIL: ${{ secrets.TODOIST_E2E_EXPECTED_EMAIL }}
      E2E_OBSIDIAN_VERSION: ${{ vars.E2E_OBSIDIAN_VERSION }}
      # "1" once the e2e Todoist account is on Pro; otherwise the Pro-only tests are skipped.
      E2E_PREMIUM: ${{ vars.E2E_PREMIUM }}
      # Point at a directory outside the workspace so history survives checkouts.
      E2E_HISTORY_FILE: ${{ vars.E2E_HISTORY_FILE || format('{0}/e2e/results/history.csv', github.workspace) }}
      E2E_RETRIES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix e2e

      - name: Select suite
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then suite=smoke
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then suite="${{ inputs.suite }}"
          else suite=full; fi
          if [ "$suite" = "smoke" ]; then script=test:smoke; else script=test:e2e; fi
          echo "script=$script" >> "$GITHUB_OUTPUT"
          echo "Running **$suite** E2E suite" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the runner can drive Obsidian
        working-directory: e2e
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run check:harness

      - name: Run E2E tests
        working-directory: e2e
        # The summary reporter also writes the pass/fail table to $GITHUB_STEP_SUMMARY.
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run ${{ steps.suite.outputs.script }}

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-summary-${{ github.run_id }}
          path: |
            e2e/results/*/summary.md
            e2e/results/*/results.json
            e2e/results/*/run-info.json
            ${{ env.E2E_HISTORY_FILE }}
          if-no-files-found: ignore

      - name: Upload full report (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            e2e/results/
            !e2e/results/latest
          retention-days: 30
          if-no-files-found: ignore

      - name: Remove per-run files from the runner
        if: always()
        run: rm -rf e2e/results e2e/.work
